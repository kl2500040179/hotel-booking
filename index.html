<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StayEasy - Hotel Booking Platform</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="brand-section">

            <div class="brand-icon">
                🏨
            </div>

            <h1>
                StayEasy
            </h1>

            <p>
                Hotel Booking Platform
            </p>


            <div class="brand-info">

                <div>

                    <span>
                        🏨
                    </span>

                    <p>
                        Find Hotels
                    </p>

                </div>


                <div>

                    <span>
                        🛏️
                    </span>

                    <p>
                        Book Rooms
                    </p>

                </div>


                <div>

                    <span>
                        ⭐
                    </span>

                    <p>
                        Best Experience
                    </p>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-box">

            <div class="auth-tabs">

                <button
                    id="loginTab"
                    class="active-tab"
                    onclick="showLogin()"
                >
                    Login
                </button>


                <button
                    id="signupTab"
                    onclick="showSignup()"
                >
                    Sign Up
                </button>

            </div>


            <!-- LOGIN FORM -->

            <div
                id="loginForm"
                class="auth-form"
            >

                <h2>
                    Welcome Back
                </h2>

                <p class="form-subtitle">
                    Login to continue
                </p>


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                >


                <button
                    class="primary-btn"
                    onclick="loginUser()"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </div>


            <!-- SIGNUP FORM -->

            <div
                id="signupForm"
                class="auth-form hidden"
            >

                <h2>
                    Create Account
                </h2>

                <p class="form-subtitle">
                    Register as a customer
                </p>


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="signupConfirmPassword"
                    placeholder="Confirm password"
                >


                <button
                    class="primary-btn"
                    onclick="signupUser()"
                >
                    Create Account
                </button>


                <p
                    id="signupMessage"
                    class="message"
                ></p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
